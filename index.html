<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Form</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f0f2f5;
        font-family: Arial, Helvetica, sans-serif;
        color: #1c1e21;
    }

    .form-container {
        width: 100%;
        max-width: 400px;
        padding: 28px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
    }

    .logo {
        display: block;
        max-width: 180px;
        max-height: 90px;
        margin: 0 auto 22px;
        object-fit: contain;
    }

    h1 {
        margin: 0 0 10px;
        text-align: center;
        font-size: 24px;
    }

    .description {
        margin: 0 0 24px;
        text-align: center;
        color: #606770;
        font-size: 14px;
        line-height: 1.5;
    }

    label {
        display: block;
        margin: 16px 0 7px;
        font-size: 14px;
        font-weight: bold;
    }

    input {
        display: block;
        width: 100%;
        padding: 14px 12px;
        border: 1px solid #ccd0d5;
        border-radius: 7px;
        font-size: 16px;
        outline: none;
    }

    input:focus {
        border-color: #1877f2;
        box-shadow: 0 0 0 2px rgba(24, 119, 242, 0.12);
    }

    .notice {
        margin: 18px 0;
        color: #606770;
        font-size: 12px;
        line-height: 1.5;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 7px;
        background: #1877f2;
        color: #ffffff;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #166fe5;
    }

    @media (max-width: 420px) {
        .form-container {
            padding: 22px;
        }
    }
</style>
</head>
<body>
<main class="form-container">

    <!-- Add your own logo image named logo.png -->
    <img
        src="logo.png"
        alt="Your logo"
        class="logo"
        onerror="this.style.display='none'"
    >

    <h1 id="page-title">Quick Form</h1>

    <p class="description" id="page-description">
        Please complete this form to continue.
    </p>

    <form id="main-form">

        <label for="contact">
            Email or phone number
        </label>

        <input
            type="text"
            id="contact"
            name="contact"
            placeholder="Email or phone number"
            autocomplete="off"
            required
        >

        <label for="answer">
            Your answer
        </label>

        <input
            type="text"
            id="answer"
            name="answer"
            placeholder="Enter your answer"
            autocomplete="off"
            required
        >

        <p class="notice">
            This demonstration form does not transmit or save
            your entries. Please do not enter passwords or
            other confidential information.
        </p>

        <button type="submit">
            Continue
        </button>

    </form>

</main>

<script>
    // Change this to your intended destination.
    const DESTINATION_URL = "https://www.google.com/";

    document
        .getElementById("main-form")
        .addEventListener("submit", function (event) {

            event.preventDefault();

            if (!this.reportValidity()) {
                return;
            }

            // This demo does not send or store form entries.
            window.location.assign(DESTINATION_URL);

        });
</script>
</body>
</html>
